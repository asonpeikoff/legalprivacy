[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalprivacy"
version = "2.24.0"
description = "legalPrivacy — privacy noise generator with optional Tor/onion mode, a local dashboard, and community relay contribution"
requires-python = ">=3.10"
dependencies = [
  "requests[socks]>=2.31",
  "PyYAML>=6.0",
  "selenium>=4.20",     # drives your own Firefox
  "playwright>=1.45",   # real-browser mode; uses the Chrome/Edge/Chromium already installed
  "psutil>=5.9",        # Proof tab: which program owns each connection (local only)
]

[project.scripts]
legalprivacy = "legalprivacy.cli:main"
legalprivacy-launch = "legalprivacy.launcher:main"
legalprivacy-mac = "legalprivacy.macspoof:main"       # headless MAC spoofing (stdlib only)
legalprivacy-gui = "legalprivacy.gui:main"             # native desktop app (Tkinter, no browser)
legalprivacy-desktop = "legalprivacy.desktop:main"   # the dashboard in its own window (needs the [desktop] extra)
cricket = "legalprivacy.cli:main"                 # old names, kept so existing setups keep working
cricket-launch = "legalprivacy.launcher:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
desktop = ["pywebview>=5"]          # native window for the dashboard (legalprivacy-desktop)
remote = ["paramiko>=3.4"]          # run the noise on other computers you own, over SSH (the Remote tab)
parity = ["brotli>=1.1", "zstandard>=0.22"]   # lets the plain-HTTP lane read and advertise br and zstd like a current browser

[project.urls]
Repository = "https://github.com/asonpeikoff/legalPrivacy"
"Named after (blog)" = "https://legalizingprivacy.substack.com"

[tool.setuptools.packages.find]
include = ["legalprivacy*"]

[tool.setuptools.package-data]
legalprivacy = ["web/*.html", "web/*.js", "web/*.png", "web/logos/*/*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["legacy-src", "nbproject", "build", "dist"]

[tool.ruff.lint]
# Real-bug rules only; style rules that would mean reformatting the code base stay off.
select = ["E", "F", "W", "B", "UP", "SIM", "RET"]
ignore = [
  "E501",    # long lines: the code base uses ~120-150 columns
  "E701", "E702", "E741",   # compact one-liners and short names (l, i) are used deliberately
  "E402",    # imports after sys.path / env set-up in entry points
  "SIM105",  # try/except/pass is clearer than contextlib.suppress here
  "SIM108", "SIM102", "SIM117", "SIM110", "SIM905",
  "UP031", "UP037", "UP035",
  "B905",    # zip(strict=) needs py3.10+ semantics review per call; lengths are equal by construction
  "RET501", "RET502", "RET503", "RET504", "RET505", "RET506", "RET507", "RET508",
]

[tool.ruff.lint.per-file-ignores]
"legalprivacy/gui_logic.py" = ["F403", "F405", "F401"]   # re-exports gui_fields for the Tk modules
"tests/__init__.py" = ["F401"]
"tests/*" = ["SIM115", "B007", "B011"]       # throwaway handles and loop vars in tests are fine

[tool.pytest.ini_options]
timeout = 240          # a hung test dumps every thread's stack (naming the culprit) and ends the run, instead of stalling it for 40 minutes
timeout_method = "thread"
