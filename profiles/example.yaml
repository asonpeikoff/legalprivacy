# legalPrivacy example profile — balanced daily noise on both transports
profile:
  name: example
  realtime_scale: 1.0
  engines:
    search:
      enabled: true
      budget_per_day: 120
      wordlist: data/wordlists/words.txt
      queries_per_identity: 6
    crawl:
      enabled: true
      budget_per_day: 40
      seeds:
        - https://en.wikipedia.org/wiki/Randomness
      max_depth: 4
      same_site_only: true
    dns:
      enabled: true
      budget_per_day: 200
    onion:                      # darknet noise; runs only when transports.tor.enabled
      enabled: true
      budget_per_day: 40
      max_depth: 3
  transports:
    clearnet:
      enabled: true
      proxy: null
    tor:                        # OPTIONAL. Off unless you turn it on.
      enabled: true
      manage: true              # true: app runs its own private Tor (auto-installs); false: use socks/control below
      onion: true               # visit .onion sites
      auto_install: true
      onion_seeds: []           # extra v3 onion URLs; empty = built-in official mirrors
      bridges: []               # e.g. "obfs4 1.2.3.4:443 FINGERPRINT cert=… iat-mode=0"
      socks: 127.0.0.1:9050     # only used when manage: false
      control: 127.0.0.1:9051
      identities_per_circuit: 8
  daily_max_failures: 30
  # community contribution — middle relay ONLY, see `legalprivacy relay gen`
  contribute:
    relay:
      enabled: false
      mode: middle
      nickname: mylegalprivacy
      contact: null
      bandwidth_rate: 5Mbit
      or_port: 9001
      dir_port: 9030
