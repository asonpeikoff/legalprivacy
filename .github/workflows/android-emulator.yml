name: Android emulator run

# Installs the app in a real Android emulator on a GitHub runner, taps Start, and prints what the app says.
# No account anywhere: GitHub's own free runner minutes. Start it by hand (Actions tab) or with the API.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK to test (default: build the one in this commit)"
        required: false

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the APK (or fetch the one given)
        env:
          APK_URL: ${{ github.event.inputs.apk_url }}
        run: |
          if [ -n "$APK_URL" ]; then
            curl -fL -o app.apk "$APK_URL"
          else
            (cd android && gradle :app:assembleDebug --console=plain)
            cp android/app/build/outputs/apk/debug/app-debug.apk app.apk
          fi
          ls -l app.apk

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run it in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/app.apk
          OUT: ${{ github.workspace }}/shots
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/ci/emulator_smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots-and-logcat
          path: shots/
