name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ruff (config in pyproject.toml)
        run: pip install ruff && ruff check .
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # a healthy run takes ~6 min; a hang fails fast instead of holding the runner ~30 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run tests (the real-browser test uses the runner's preinstalled Chrome)
        run: python -m pytest -q
