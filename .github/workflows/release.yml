name: Build & Release Executables

on:
  push:
    tags:
      - 'v*'          # trigger on any version tag, e.g. v2.2.0
  workflow_dispatch:     # or start it by hand (Actions tab / API) with a version; it creates the tag
    inputs:
      tag:
        description: "Release tag to create, e.g. v2.8.0"
        required: true

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build:
    strategy:
      fail-fast: false      # one platform's problem must not cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            artifact: legalprivacy-launch-linux
            rename: legalprivacy-launch-linux
          # Windows and macOS builds are STILL UNDER DEVELOPMENT and are not being built for releases right now
          # (decision: leave them for later). The configuration is kept here so they are easy to switch back on:
          # - os: windows-latest
          #   artifact: legalprivacy-launch.exe
          #   rename: legalprivacy-launch-windows.exe
          # - os: macos-latest
          #   artifact: legalprivacy-launch
          #   rename: legalprivacy-launch-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e '.[dev]'
          pip install pyinstaller
          python -m pytest -q

      - name: Build executable
        run: pyinstaller legalprivacy.spec --clean --noconfirm

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv dist/legalprivacy-launch dist/${{ matrix.rename }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist\legalprivacy-launch.exe dist\${{ matrix.rename }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rename }}
          path: dist/${{ matrix.rename }}

  release:
    needs: build
    if: ${{ !cancelled() }}      # still publish when macOS had no runner; the check below keeps Windows+Linux mandatory
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Require the Linux build
        run: test -f dist/legalprivacy-launch-linux/legalprivacy-launch-linux

      - name: Make Linux/macOS binaries executable
        run: |
          chmod +x dist/legalprivacy-launch-linux/legalprivacy-launch-linux || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "legalPrivacy ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ## ⚖️ legalPrivacy ${{ github.event.inputs.tag || github.ref_name }}

            Believable background browsing, searches and DNS lookups, so bulk analysis of your traffic tells much less about you.

            ### Download and run (nothing to install)

            | Platform | File | How to run |
            |---|---|---|
            | Linux | `legalprivacy-launch-linux` | `chmod +x legalprivacy-launch-linux && ./legalprivacy-launch-linux` |

            **Windows and macOS:** ready-made downloads are still under development and are not part of this release.
            On those systems, run from source (see the README: `Start-legalPrivacy.bat` on Windows, `start-legalprivacy.command` on macOS)
            or `pip install` as below.

            Your browser opens the dashboard, you answer three quick questions, and it starts. A real Chrome, Edge,
            Brave or Chromium on the computer makes the browsing look human; Tor is optional and set up for you.

            Or from source: `pip install git+https://github.com/asonpeikoff/legalPrivacy` then `legalprivacy-launch`.

            Named in homage to the blog [Legalizing Privacy](https://legalizingprivacy.substack.com) by Amy Peikoff.

            ### What's new
            See the [changelog](https://github.com/asonpeikoff/legalPrivacy/blob/master/CHANGELOG.md).
          files: |
            dist/legalprivacy-launch-linux/legalprivacy-launch-linux
          draft: false
          prerelease: false
